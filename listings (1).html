<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title> Student House Hunters - View Lisitngs </title>
        <link rel="stylesheet" href="style.css">
        <script src="script.js"> </script>
        <!--Bootstrap files-->
        <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css">
        <script src="bootstrap/js/bootstrap.bundle.min.js"></script>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

        <!--Leaflet files for interactive map-->
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    </head>

    <body>

        <header class="header">
            <a class="header-brand" href="#">Student House Hunters</a>
            <div class="header-nav-left">
                <!-- View Listings Icon-->
                <a class="nav-item nav-link nav-icon active" href="listings.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 4px;">
                    <i class="bi bi-house-fill" style="font-size: 2rem"></i>
                    View Listings <span class="visually-hidden">(current)</span>
                </a>

                <!-- My Roommates Icon-->
                <a class="nav-item nav-link nav-icon" href="group_collaboration.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 4px;">
                    <i class="bi bi-people-fill" style="font-size: 2rem"></i>
                    <span>My Roommates</span>
                </a>
            </div>
            <div class="header-nav-right">
                <div class="profile-container">
                    <a class="nav-item nav-link" id="profileIcon" href="javascript:void(0);">
                        <i class="bi bi-person-circle" style="font-size: 3rem; cursor: pointer;"></i>
                    </a>
            
                    <!-- Dropdown menu -->
                    <div class="profile-menu" id="profileMenu">
                      <a href="#">
                          <i class="bi bi-person-fill"></i> My Profile
                      </a>
                      <a href="#">
                          <i class="bi bi-gear-fill"></i> Settings
                      </a>
                      <a href="#">
                          <i class="bi bi-question-circle-fill"></i> Help
                      </a>
                      <a href="javascript:void(0);" id="logoutBtn">
                        <i class="bi bi-box-arrow-right"></i> Logout
                    </a>
                    
                  </div>
                  
                </div>
            </div>
        </header>

        <main>
            <nav class="navbar navbar-light bg-light">
                <div class="container-fluid px-0">
                    <form class="d-flex w-100 px-3">
                        <input class="form-control me-2 flex-grow-1" type="search" placeholder="Search for a house or keyword" aria-label="Search" id="search-input">
                        <button class="btn btn-danger" type="submit" id="search-button">Search</button>
                    </form>
                </div>
            </nav>     
                

            <div class='page-container'>
                
                <div class="filter-box">
                    <h2 style="text-align: center;">My Filters</h2>
                    <br>

                    <!-- Accomodation Type dropdown menu-->
                    <label for="accom-type">Accomodation Type:</label>
                    <select id="accom-type" name="accom-type">
                        <option value="" selected disabled hidden>Select</option>
                        <option value="all">All</option>
                        <option value="house">House</option>
                        <option value="apartment">Apartment</option>
                        <option value="townhouse">Townhouse</option>
                    </select>
                    <br><br>

                    <h3>Rent</h3>
                    <form class="rent-form">
                        <div class="rent-box">
                            <label for="min-rent">Min ($):</label>
                            <input type="number" id="min-rent" name="min-rent" min="0">
                        </div>

                        <div class="rent-box">
                            <label for="max-rent">Max ($):</label>
                            <input type="number" id="max-rent" name="max-rent" min="0">
                        </div>
                    </form>

                    <form>
                        <label>Utilities included: </label>

                        <input type="radio" id="yes" name="include-util" value="yes-util">
                        <label for="yes">Yes</label>

                        <input type="radio" id="no" name="include-util" value="no-util">
                        <label for="no">No</label>
                    </form>
                    <br>
                    <h3>Location</h3>
                        <div style="display: flex; flex-direction: column; gap: 5px;">
                            <div style="display: flex; align-items: center; gap: 5px;">
                                <p style="margin: 0;">Select destination:</p>
                                <!-- Button to open map for destination -->
                                <button type="button" class="btn btn-primary btn-sm" style="background-color: #ffffff; border: 1px solid #ccc;" data-bs-toggle="modal" data-bs-target="#mapModal">
                                    <i class="bi bi-pin-map-fill" style="font-size: 1rem; color: #0c0303"></i>
                                </button>
                            </div>

                            <!-- Walking time on the next line -->
                            <div>
                                <label for="walk-time" style="margin-right: 5px;">Walking time:</label>
                                <select id="walk-time" name="walk-time" style="margin: 0; padding: 2px 5px;">
                                    <option value="" selected disabled hidden>Select</option>
                                    <option value="5-less">Less than 5 mins</option>
                                    <option value="5-10">5-10 mins</option>
                                    <option value="11-20">11-20 mins</option>  
                                    <option value="21-30">21-30 mins</option>
                                    <option value="30-plus">More than 30 mins</option>  
                                </select>
                            </div>
                        </div>

                   
                    <br><br>
                    <h3>Rooms</h3>
                    <!-- Rooms section-->
                     <div class="form-group">
                        <label for="num-rooms">Number of Rooms Needed: </label>
                        <input type="number" min="1" max="10" id="num-rooms" name="num-rooms">
                    </div>

                    <div class="form-group">
                        <label for="num-bath">Number of Bathrooms: </label>
                        <input type="number" min="1" max="4" id="num-bath" name="num-bath">
                    </div>

                    <form>
                        <label for="all-rooms">Whole house available: </label>

                        <input type="radio" id="yes" name="agreement" value="yes-all-rooms">
                        <label for="yes">Yes</label>

                        <input type="radio" id="no" name="agreement" value="no-all-rooms">
                        <label for="yes">No</label>
                    </form>
                    <br>

                        <h3>Utilities</h3>
                        <form>
                            <input type="checkbox" id="wifi" name="utilities" value="wifi">
                            <label for="wifi">Wifi</label><br>

                            <input type="checkbox" id="washer" name="utilities" value="washer">
                            <label for="washer">Washer</label><br>

                            <input type="checkbox" id="dryer" name="utilities" value="dryer">
                            <label for="dryer">Dryer</label><br>

                            <input type="checkbox" id="air-cond" name="utilities" value="air-cond">
                            <label for="air-cond">Air Conditioning</label><br>

                            <input type="checkbox" id="heating" name="utilities" value="heating">
                            <label for="heating">Heating</label><br>

                            <input type="checkbox" id="dishwasher" name="utilities" value="dishwasher">
                            <label for="dishwasher">Dishwasher</label><br>

                            <input type="checkbox" id="parking" name="utilities" value="parking">
                            <label for="parking">Parking</label><br>
                        </form>
                        <br>
                        <h3>Services</h3>
                        <form>
                            <input type="checkbox" id="cleaning" name="services" value="cleaning">
                            <label for="cleaning">Cleaning</label><br>

                            <input type="checkbox" id="grass-cut" name="services" value="grass-cut">
                            <label for="grass-cut">Grass cutting</label><br>

                            <input type="checkbox" id="shovelling" name="services" value="shovelling">
                            <label for="shovelling">Shovelling</label>
                        </form>
                        <br>
                        <h3>Housemates</h3>
                        <form>
                            <input type="checkbox" id="female" name="housemates" value="female">
                            <label for="female">All Female</label><br>

                            <input type="checkbox" id="male" name="housemates" value="male">
                            <label for="male">All Male</label><br>
                            
                            <input type="checkbox" id="co-ed" name="housemates" value="co-ed">
                            <label for="co-ed">Co-ed</label>
                        </form>
                        <br>
                        <h3>House Rules</h3>
                        <form>
                            <input type="checkbox" id="non-smoke" name="house-rules" value="non-smoke">
                            <label for="non-smoke">No smoking</label><br>

                            <input type="checkbox" id="quiet-hours" name="house-rules" value="quiet-hours">
                            <label for="quiet-hours">Quiet hours</label><br>
                            
                            <input type="checkbox" id="no-guests" name="house-rules" value="no-guests">
                            <label for="no-guests">No guests</label>
                        </form>

                        <div class="filter-box d-flex justify-content-center border-0">
                            <button type="button" id="filter-button" class="btn btn-secondary">Submit</button>
                        </div>
                    
                </div>
                
                <!-- Listings Section -->
                <div class="listings-box">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h2 class="mb-0">Top Matches</h2>
                        <button class="btn btn-secondary" type="button" id="show-all-button">Show All</button>
                    </div>
                    <div class="row" id="listing-container"></div>
                </div>


            
            </div>
             
        </main>

        <footer>
            
        </footer>

   

    <!-- Modal for interactive map for destination-->
            <div class="modal fade" id="mapModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                    <div class="modal-header">
                        <h1 class="modal-title fs-5" id="exampleModalLabel">Select destination</h1>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div id="map" style="height: 400px; width: 100%;"></div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Confirm</button>
                    </div> 
                    </div>
                </div>
            </div>

        <script src="listings.js"></script>
        <script src="map.js"></script>
        <script src="group_collaboration.js"></script>


        <script>
            document.getElementById("profileIcon").addEventListener("click", function () {
                const menu = document.getElementById("profileMenu");
                menu.classList.toggle("show");
            });
            
            document.addEventListener("click", function (event) {
                const menu = document.getElementById("profileMenu");
                const icon = document.getElementById("profileIcon");
            
                if (!menu.contains(event.target) && !icon.contains(event.target)) {
                    menu.classList.remove("show");
                }
            });
        </script>
            

    </body>
   
</html>
